<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teatro Don Bosco | Premium Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top left, #1e293b, #0f172a, #000000);
      min-height: 100vh;
      overflow: hidden;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2.5rem;
    }
    .payment-sheet {
      transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1);
      transform: translateY(100%);
    }
    .payment-sheet.active { transform: translateY(0); }
    
    .snack-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .snack-card.selected {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }
    .seat { transition: all 0.2s ease; }
    .hidden-step { display: none; }
  </style>
</head>

<body class="text-white flex flex-col items-center justify-center p-4">

  <div class="glass-card w-full max-w-2xl p-8 shadow-2xl relative z-10">
    <header class="text-center mb-6">
        <h1 class="text-4xl font-semibold tracking-tight mb-2">Teatro Don Bosco</h1>
        <p class="text-gray-400 text-sm">Secure Seat Reservation</p>
    </header>

    <div class="mb-6">
      <input type="text" id="userName" placeholder="Full Name" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-center text-lg font-light"/>
    </div>

    <div class="mb-8">
      <div class="flex bg-white/5 p-1 rounded-xl max-w-xs mx-auto">
        <button id="adultMode" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-white/10">Adult $15</button>
        <button id="childMode" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all text-gray-500">Child $8</button>
      </div>
    </div>

    <div id="seat-container" class="grid grid-cols-10 gap-2 mb-10 justify-center"></div>

    <button id="openPaymentBtn" class="w-full bg-white text-black font-semibold py-5 rounded-3xl active:scale-[0.97] transition-all flex flex-col items-center justify-center shadow-2xl">
      <span id="btnText">Select Seats</span>
      <span class="text-[10px] opacity-60 uppercase">Continue to Checkout</span>
    </button>
  </div>

  <div id="paymentOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 z-20"></div>
  
  <div id="paymentSheet" class="payment-sheet fixed bottom-0 left-0 right-0 z-30 bg-[#1c1c1e] rounded-t-[2.5rem] p-8 pb-12 shadow-[0_-20px_40px_rgba(0,0,0,0.5)] max-w-2xl mx-auto border-t border-white/10">
    <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-8"></div>

    <div id="step1">
      <h2 class="text-2xl font-semibold mb-6 text-center">Payment Method</h2>
      <div class="space-y-4">
        <button onclick="goToSnacks('QR')" class="w-full flex items-center gap-4 bg-white/5 p-5 rounded-2xl border border-white/10 hover:bg-white/10 transition-all">
          <div class="w-12 h-12 bg-blue-500/20 rounded-xl flex items-center justify-center text-xl text-blue-400">📱</div>
          <div class="text-left"><p class="font-semibold">QR Transfer</p><p class="text-xs text-gray-500">Instant banking</p></div>
        </button>
        <button onclick="goToSnacks('Card')" class="w-full flex items-center gap-4 bg-white/5 p-5 rounded-2xl border border-white/10 hover:bg-white/10 transition-all">
          <div class="w-12 h-12 bg-purple-500/20 rounded-xl flex items-center justify-center text-xl text-purple-400">💳</div>
          <div class="text-left"><p class="font-semibold">Credit Card</p><p class="text-xs text-gray-500">Visa / Mastercard</p></div>
        </button>
      </div>
    </div>

    <div id="step2" class="hidden-step">
      <h2 class="text-2xl font-semibold mb-1 text-center">Enjoy the Show?</h2>
      <p class="text-gray-500 text-sm text-center mb-8">Add a snack to complete your experience</p>
      
      <div class="grid grid-cols-2 gap-4 mb-8">
        <div id="snack-popcorn" onclick="toggleSnack('popcorn', 7)" class="snack-card p-6 rounded-3xl text-center cursor-pointer">
          <div class="text-4xl mb-3">🍿</div>
          <p class="font-bold">Popcorn</p>
          <p class="text-xs text-gray-400">Large • $7.00</p>
        </div>
        <div id="snack-soda" onclick="toggleSnack('soda', 5)" class="snack-card p-6 rounded-3xl text-center cursor-pointer">
          <div class="text-4xl mb-3">🥤</div>
          <p class="font-bold">Soda</p>
          <p class="text-xs text-gray-400">Chilled • $5.00</p>
        </div>
      </div>

      <div class="border-t border-white/5 pt-6 mb-6">
        <div class="flex justify-between text-sm text-gray-400 mb-2">
            <span>Seats Subtotal</span>
            <span id="seatPriceLabel">$0</span>
        </div>
        <div class="flex justify-between text-lg font-bold">
            <span>Final Total</span>
            <span id="finalTotalLabel">$0</span>
        </div>
      </div>

      <button onclick="finalizeTransaction()" class="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/20 active:scale-95 transition-all">
        Pay & Confirm
      </button>
    </div>

    <button id="closeSheetBtn" class="w-full mt-6 py-2 text-gray-600 text-sm font-medium">Cancel</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIy47-9kwKCtaJu75oln7lMBpxUphWA_A",
      authDomain: "don-bosco-theater.firebaseapp.com",
      projectId: "don-bosco-theater",
      storageBucket: "don-bosco-theater.firebasestorage.app",
      messagingSenderId: "270986848021",
      appId: "1:270986848021:web:49e21ab57699ca4eb32b1c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentTicketType = 'adult';
    let selectedSeats = new Map();
    let selectedSnacks = { popcorn: false, soda: false };
    let chosenMethod = '';
    const PRICES = { adult: 15, child: 8, popcorn: 7, soda: 5 };

    // Mode Toggles
    document.getElementById('adultMode').onclick = () => setType('adult');
    document.getElementById('childMode').onclick = () => setType('child');

    function setType(type) {
      currentTicketType = type;
      document.getElementById('adultMode').className = type === 'adult' ? 'flex-1 py-2 rounded-lg text-xs font-bold bg-white/10' : 'flex-1 py-2 rounded-lg text-xs font-bold text-gray-500';
      document.getElementById('childMode').className = type === 'child' ? 'flex-1 py-2 rounded-lg text-xs font-bold bg-white/10' : 'flex-1 py-2 rounded-lg text-xs font-bold text-gray-500';
    }

    // Load and Render
    async function loadSeats() {
      const querySnapshot = await getDocs(collection(db, "seats"));
      const taken = new Set();
      querySnapshot.forEach(d => { if(d.data().taken) taken.add(d.id); });
      renderGrid(taken);
    }

    function renderGrid(taken) {
      const container = document.getElementById('seat-container');
      container.innerHTML = "";
      for (let r = 0; r < 8; r++) {
        for (let c = 1; c <= 10; c++) {
          const id = String.fromCharCode(65 + r) + c;
          const seat = document.createElement('div');
          seat.innerText = id;
          seat.className = `seat w-7 h-7 sm:w-10 sm:h-10 flex items-center justify-center rounded-lg text-[9px] font-bold border border-white/5 ${taken.has(id) ? 'opacity-20' : 'bg-white/10 text-white/40 cursor-pointer hover:bg-white/20'}`;
          
          if(!taken.has(id)) {
            seat.onclick = () => {
              if(selectedSeats.has(id)) {
                selectedSeats.delete(id);
                seat.className = "seat w-7 h-7 sm:w-10 sm:h-10 flex items-center justify-center rounded-lg text-[9px] font-bold border border-white/5 bg-white/10 text-white/40 cursor-pointer hover:bg-white/20";
              } else {
                selectedSeats.set(id, { type: currentTicketType, price: PRICES[currentTicketType] });
                seat.className = `seat w-7 h-7 sm:w-10 sm:h-10 flex items-center justify-center rounded-lg text-[9px] font-bold border border-white/5 ${currentTicketType === 'adult' ? 'bg-blue-500' : 'bg-purple-500'} text-white shadow-lg cursor-pointer`;
              }
              document.getElementById('btnText').innerText = selectedSeats.size > 0 ? `Reserve ${selectedSeats.size} Seats` : "Select Seats";
            };
          }
          container.appendChild(seat);
        }
      }
    }

    // Payment Flow
    document.getElementById('openPaymentBtn').onclick = () => {
      if(!document.getElementById('userName').value || selectedSeats.size === 0) return alert("Fill name and pick seats");
      document.getElementById('paymentSheet').classList.add('active');
      document.getElementById('paymentOverlay').classList.replace('opacity-0', 'opacity-100');
      document.getElementById('paymentOverlay').classList.remove('pointer-events-none');
    };

    window.goToSnacks = (method) => {
      chosenMethod = method;
      document.getElementById('step1').classList.add('hidden-step');
      document.getElementById('step2').classList.remove('hidden-step');
      calculateFinalTotal();
    };

    window.toggleSnack = (snack, price) => {
      selectedSnacks[snack] = !selectedSnacks[snack];
      document.getElementById(`snack-${snack}`).classList.toggle('selected');
      calculateFinalTotal();
    };

    function calculateFinalTotal() {
      let seatTotal = 0;
      selectedSeats.forEach(v => seatTotal += v.price);
      let snackTotal = (selectedSnacks.popcorn ? PRICES.popcorn : 0) + (selectedSnacks.soda ? PRICES.soda : 0);
      document.getElementById('seatPriceLabel').innerText = `$${seatTotal}.00`;
      document.getElementById('finalTotalLabel').innerText = `$${seatTotal + snackTotal}.00`;
    }

    window.finalizeTransaction = async () => {
      document.getElementById('step2').innerHTML = `<div class="py-20 text-center animate-pulse"><p class="text-xl font-semibold">Finalizing Payment...</p></div>`;
      
      const batch = writeBatch(db);
      selectedSeats.forEach((data, id) => {
        batch.set(doc(db, "seats", id), {
          taken: true,
          user: document.getElementById('userName').value.trim(),
          method: chosenMethod,
          snacks: selectedSnacks,
          timestamp: Date.now()
        });
      });

      await new Promise(r => setTimeout(r, 2000));
      await batch.commit();
      alert("Reservation confirmed with snacks!");
      window.location.reload();
    };

    document.getElementById('closeSheetBtn').onclick = () => window.location.reload();

    loadSeats();
  </script>
</body>
</html>
