<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Theatre Seat Reservation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold mb-6">🎭 Teatro Don Bosco</h1>

  <div id="seat-container" class="grid grid-cols-10 gap-2"></div>

  <button id="reserveBtn" class="mt-6 bg-blue-600 px-6 py-2 rounded hover:bg-blue-700">
    Continue to Reservation
  </button>

  <script>
    const container = document.getElementById("seat-container");

    const rows = ["A","B","C","D","E"];
    const seatsPerRow = 10;

    let seats = [];

    // Create seats
    rows.forEach(row => {
      for (let i = 1; i <= seatsPerRow; i++) {
        const seatId = row + i;

        // Mock some taken seats
        const isTaken = Math.random() < 0.2;

        seats.push({
          id: seatId,
          status: isTaken ? "taken" : "available"
        });
      }
    });

    function renderSeats() {
      container.innerHTML = "";

      seats.forEach(seat => {
        const div = document.createElement("div");
        div.innerText = seat.id;

        let color = "bg-gray-500";

        if (seat.status === "taken") color = "bg-red-500";
        if (seat.status === "selected") color = "bg-green-500";

        div.className = `
          ${color}
          w-10 h-10 flex items-center justify-center
          rounded cursor-pointer text-sm
        `;

        div.onclick = () => handleSeatClick(seat.id);

        container.appendChild(div);
      });
    }

    function handleSeatClick(id) {
      const seat = seats.find(s => s.id === id);

      if (seat.status === "taken") return;

      seat.status = seat.status === "selected" ? "available" : "selected";

      renderSeats();
    }

    document.getElementById("reserveBtn").onclick = () => {
      const selected = seats.filter(s => s.status === "selected");

      if (selected.length === 0) {
        alert("Please select at least one seat.");
        return;
      }

      alert("Selected seats: " + selected.map(s => s.id).join(", "));
    };

    renderSeats();
  </script>

</body>
</html>
