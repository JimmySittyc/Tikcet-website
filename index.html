<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teatro Don Bosco</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold mb-6">🎭 Teatro Don Bosco</h1>

  <!-- User Name Input -->
  <div class="mb-4">
    <input 
      type="text" 
      id="userName" 
      placeholder="Enter your name" 
      class="px-3 py-2 rounded text-black w-64"
    />
  </div>

  <!-- Seat Legend -->
  <div class="flex gap-4 mb-6">
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 bg-gray-400 rounded"></div>
      <span>Available</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 bg-red-500 rounded"></div>
      <span>Taken</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 bg-blue-500 rounded"></div>
      <span>Selected</span>
    </div>
  </div>

  <!-- Seat Grid -->
  <div id="seat-container" class="grid grid-cols-10 gap-2 mb-6"></div>

  <!-- Pay & Reserve Button -->
  <button 
    id="payReserveBtn"
    class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded text-lg"
  >
    💳 Pay & Reserve
  </button>

  <!-- Firebase + App Logic -->
  <script type="module">
    // ✅ Firebase CDN Imports (MODULAR SDK)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      collection, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ✅ Your Firebase Config (CONNECTED)
    const firebaseConfig = {
      apiKey: "AIzaSyDIy47-9kwKCtaJu75oln7lMBpxUphWA_A",
      authDomain: "don-bosco-theater.firebaseapp.com",
      projectId: "don-bosco-theater",
      storageBucket: "don-bosco-theater.firebasestorage.app",
      messagingSenderId: "270986848021",
      appId: "1:270986848021:web:49e21ab57699ca4eb32b1c"
    };

    // ✅ Initialize Firebase
    const app = initializeApp(firebaseConfig);

    // ✅ Initialize Firestore
    const db = getFirestore(app);

    // ✅ Confirmation log
    console.log("🔥 Firestore Database connected successfully!");

    // UI Elements
    const seatContainer = document.getElementById("seat-container");
    const payReserveBtn = document.getElementById("payReserveBtn");
    const userNameInput = document.getElementById("userName");

    const rows = 8;
    const cols = 10;
    let selectedSeatId = null;

    // Load seats from Firestore
    async function loadSeats() {
      seatContainer.innerHTML = "";

      const querySnapshot = await getDocs(collection(db, "seats"));
      const takenSeats = new Set();

      querySnapshot.forEach(docSnap => {
        if (docSnap.data().taken) {
          takenSeats.add(docSnap.id);
        }
      });

      renderSeats(takenSeats);
    }

    // Render seats
    function renderSeats(takenSeats) {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const seatId = String.fromCharCode(65 + r) + (c + 1);
          const seat = document.createElement("div");

          seat.innerText = seatId;
          seat.className = "w-10 h-10 flex items-center justify-center rounded text-sm";

          if (takenSeats.has(seatId)) {
            seat.classList.add("bg-red-500");
          } else {
            seat.classList.add("bg-gray-400", "cursor-pointer");

            seat.addEventListener("click", () => {
              const allSeats = document.querySelectorAll("#seat-container div");

              allSeats.forEach(s => {
                if (!s.classList.contains("bg-red-500")) {
                  s.classList.remove("bg-blue-500");
                  s.classList.add("bg-gray-400");
                }
              });

              seat.classList.remove("bg-gray-400");
              seat.classList.add("bg-blue-500");

              selectedSeatId = seatId;
            });
          }

          seatContainer.appendChild(seat);
        }
      }
    }

    // Simulated Payment + Reserve
    payReserveBtn.addEventListener("click", async () => {
      const name = userNameInput.value.trim();

      if (!name) {
        alert("Please enter your name!");
        return;
      }

      if (!selectedSeatId) {
        alert("Select a seat first!");
        return;
      }

      try {
        payReserveBtn.disabled = true;
        payReserveBtn.innerText = "Processing Payment... 💳";

        await new Promise(resolve => setTimeout(resolve, 2000));

        // Save to Firestore
        await setDoc(doc(db, "seats", selectedSeatId), {
          taken: true,
          user: name,
          timestamp: Date.now()
        });

        showTicket(selectedSeatId, name);

      } catch (error) {
        console.error("Error reserving seat:", error);
        alert("Something went wrong. Check console.");
      }

      // Reset UI
      selectedSeatId = null;
      userNameInput.value = "";
      payReserveBtn.disabled = false;
      payReserveBtn.innerText = "💳 Pay & Reserve";

      loadSeats();
    });

    // Show ticket
    function showTicket(seatId, name) {
      const ticketWindow = window.open("", "Ticket", "width=300,height=200");

      ticketWindow.document.write(`
        <h1 style="text-align:center;">🎟️ Teatro Don Bosco</h1>
        <p><strong>Name:</strong> ${name}</p>
        <p><strong>Seat:</strong> ${seatId}</p>
        <p style="margin-top:20px; text-align:center;">Enjoy the show!</p>
      `);
    }

    // Initial load
    loadSeats();
  </script>
</body>
</html>
